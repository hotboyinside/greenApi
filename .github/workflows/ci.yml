name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Проверки и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: checks-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Получить код
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Установить Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Установить pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Настроить кеш pnpm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Проверить ESLint
        run: pnpm lint

      - name: Проверить TypeScript
        run: pnpm typecheck

      - name: Проверить форматирование
        run: pnpm format:check

      - name: Запустить Vitest
        run: pnpm test:run

      - name: Установить Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Запустить Playwright
        run: pnpm test:e2e

      - name: Проверить сборку для Pages
        run: pnpm build:ci
